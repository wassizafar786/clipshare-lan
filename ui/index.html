<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>ClipShare LAN</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="updateBar" class="update-bar hidden" role="status">
      <span id="updateText">A newer version is available.</span>
      <div class="row">
        <button id="btnUpdate" type="button">Update</button>
        <button id="btnDismissUpdate" type="button" class="ghost">Dismiss</button>
      </div>
    </div>
    <div class="page">
      <header class="row between">
        <div>
          <h1>ClipShare</h1>
          <p class="sub">Same Wi‑Fi clipboard · tray / menu bar</p>
        </div>
        <p class="version" id="appVersion">v—</p>
      </header>

      <section class="card">
        <label>This device</label>
        <input id="deviceName" type="text" />
        <p class="meta" id="deviceMeta"></p>
        <label class="row">
          <input id="syncEnabled" type="checkbox" checked />
          Sync clipboard
        </label>
      </section>

      <section class="card radar-card">
        <div class="row between">
          <h2>Find &amp; pair</h2>
          <button id="btnPair" type="button">Start pairing</button>
        </div>
        <p class="hint" id="radarHint">
          Start pairing to show a code. Nearby devices appear on the radar.
        </p>

        <div class="radar" id="radar" aria-label="LAN device radar">
          <div class="radar-disk" aria-hidden="true">
            <div class="radar-rings">
              <span></span><span></span><span></span>
            </div>
            <div class="radar-sweep"></div>
            <div class="radar-center" id="radarCenter">
              <p id="pairCode" class="code hidden">------</p>
              <p class="center-label" id="centerLabel">You</p>
              <p class="center-kind" id="centerKind">PC</p>
            </div>
          </div>
          <div id="radarPeers" class="radar-peers"></div>
        </div>

        <button id="btnCancelPair" class="ghost hidden" type="button">Cancel pairing</button>

        <ul id="peers" class="peer-list" aria-live="polite"></ul>

        <details class="manual">
          <summary>Manual host:port (fallback)</summary>
          <div class="row">
            <input id="manualHost" type="text" placeholder="192.168.1.20" />
            <input id="manualPort" type="text" placeholder="port" style="max-width: 90px" />
            <button id="btnManual" type="button">Add</button>
          </div>
          <p class="hint">Other device shows its port under “This device”.</p>
        </details>
      </section>
    </div>

    <dialog id="pairDialog">
      <form id="pairForm">
        <h3>Enter pairing code</h3>
        <p id="pairPeerName"></p>
        <input
          id="pairInput"
          inputmode="numeric"
          maxlength="6"
          placeholder="6-digit code"
          autocomplete="one-time-code"
        />
        <p id="pairError" class="error hidden" role="alert"></p>
        <menu>
          <button id="pairCancel" type="button">Cancel</button>
          <button id="pairSubmit" type="submit">Connect</button>
        </menu>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
